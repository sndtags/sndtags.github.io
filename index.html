    <div id="video-container">
        <video id="video" autoplay="" muted="" loop="" playsinline="" draggable="false" preload="auto">
            <source src="media/video.mp4" type="video/mp4">
        </video>
    </div>
    
    <script>
        (function(){
            'use strict';
            
            const v=document.getElementById('video'),
                  b=document.getElementById('bg'),
                  c=document.getElementById('video-container'),
                  e=true;
            
            let f=!1,t=0,pl=!1,pe=[];
            
            function preloadExp(){
                if(pl)return;
                const i=new Image();
                i.onload=function(){pl=!0};
                i.src='/assets/explosion.gif';
            }
            
            function captureFirstFrame(){
                if(f)return;
                const n=document.createElement('canvas');
                n.width=v.videoWidth;
                n.height=v.videoHeight;
                const x=n.getContext('2d');
                x.drawImage(v,0,0,n.width,n.height);
                b.src=n.toDataURL('image/jpeg');
                f=!0;
            }
            
            function showExp(){
                if(!e)return;
                const d=document.createElement('div');
                d.className='explosion';
                document.body.appendChild(d);
                setTimeout(function(){d.remove()},2000);
            }
            
            function qExp(){
                pl?showExp():pe.push(!0)&&!document.querySelector('link[href="/assets/explosion.gif"]')&&preloadExp();
            }
            
            function handleInt(){
                if(v.muted){
                    v.muted=!1;
                    v.play();
                }
                t++;
                (1===t||0===t%5)&&qExp();
            }
            
            function startP(){
                v.style.transform='scale(0.94)';
            }
            
            function endP(){
                v.style.transform='scale(1)';
            }
            
            function resizeV(){
                const r=v.videoWidth/v.videoHeight,
                      cr=c.clientWidth/c.clientHeight;
                r>cr?(v.style.width='100%',v.style.height='auto'):(v.style.width='auto',v.style.height='100%');
            }
            
            if(e)preloadExp();
            
            v.addEventListener('loadeddata',function(){
                v.readyState>=2&&captureFirstFrame();
            });
            
            v.addEventListener('seeked',captureFirstFrame);
            v.addEventListener('loadedmetadata',resizeV);
            window.addEventListener('resize',resizeV);
            
            const po={passive:!0};
            document.addEventListener('mousedown',startP);
            document.addEventListener('mouseup',endP);
            document.addEventListener('mouseleave',endP);
            document.addEventListener('touchstart',startP,po);
            document.addEventListener('touchend',endP,po);
            document.addEventListener('touchcancel',endP,po);
            document.addEventListener('click',handleInt);
            document.addEventListener('touchend',handleInt,po);
        })();
    </script>
